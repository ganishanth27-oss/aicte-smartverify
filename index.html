<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AICTE SmartVerify — Full Local Demo</title>
<style>

tems:center;gap:9px;color:var(--muted);font-size:11px}.avatar{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#d6f1ed;color:var(--teal2);font-weight:800}.content{max-width:1500px;padding:24px 30px 45px}.demo{background:#e9f5fb;border:1px solid #c8dce9;color:#35617b;border-radius:8px;padding:8px 12px;font-size:10px;font-weight:800;margin-bottom:20px}.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;margin-bottom:20px}.page-head h2{font-size:25px;letter-spacing:-.7px;margin:0 0 6px}.page-head p{color:var(--muted);line-height:1.55;margin:0;max-width:730px;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:7px;padding:9px 12px;font-weight:800;font-size:11px;display:inline-flex;gap:6px;align-items:center}.btn:hover{box-shadow:0 4px 12px #18375418;transform:translateY(-1px)}.btn.primary{background:var(--navy2);border-color:var(--navy2);color:#fff}.btn.teal{background:var(--teal);border-color:var(--teal);color:#fff}.btn.danger{color:var(--red);border-color:#f0cac7;background:#fff6f5}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:17px}.metric{background:#fff;border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:10px;padding:15px}.metric.blue{border-left-color:var(--blue)}.metric.amber{border-left-color:#e1a326}.metric.red{border-left-color:var(--red)}.metric strong{display:block;font-size:27px;letter-spacing:-1px}.metric span{display:block;color:var(--muted);font-size:10px;margin-top:4px}.cols{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(290px,.65fr);gap:17px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:11px;overflow:hidden;margin-bottom:17px}.card-head{padding:15px 17px;border-bottom:1px solid #e9f0f4;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.card-head h3{font-size:13px;margin:0 0 4px}.card-head p{font-size:10px;color:var(--muted);margin:0;line-height:1.45}.card-body{padding:17px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:690px}th{text-align:left;background:#f7fafc;color:#71879b;text-transform:uppercase;letter-spacing:.65px;font-size:9px;padding:10px 12px;white-space:nowrap}td{padding:12px;border-bottom:1px solid #edf2f5;font-size:11px;vertical-align:middle}tr:last-child td{border-bottom:0}tr.clickable{cursor:pointer}tr.clickable:hover td,tr.selected td{background:#eefaf7}.ref{font:700 10px monospace;color:#176c98}.muted{color:var(--muted);font-size:10px;margin-top:3px}.chip{display:inline-block;border-radius:999px;padding:5px 8px;font-size:9px;font-weight:800;white-space:nowrap}.chip.green{color:var(--green);background:#e1f6f0}.chip.amber{color:var(--amber);background:#fff3d4}.chip.red{color:var(--red);background:#fff0ef}.chip.blue{color:var(--blue);background:#eaf3fc}.chip.gray{color:#667b8b;background:#eef3f6}.alert{border:1px solid #f0dba9;background:#fff9e9;color:#765718;padding:11px 13px;border-radius:8px;font-size:11px;line-height:1.5;margin-bottom:12px}.alert strong{display:block;margin-bottom:3px}.success{border-color:#bce6dc;background:#effaf7;color:#16665f}.danger{border-color:#efc9c6;background:#fff6f5;color:#8f3e3b}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{border:1px solid var(--line);background:#fbfdfe;border-radius:7px;padding:9px 10px;color:var(--ink);outline:0;width:100%;font-size:12px}.input:focus,.select:focus,.textarea:focus{border-color:#60cbbf;box-shadow:0 0 0 3px #e2f8f4}.search{flex:1;min-width:220px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#587086;font-weight:800}.textarea{min-height:115px;resize:vertical}.bar{display:grid;grid-template-columns:125px 1fr 25px;gap:8px;align-items:center;margin:12px 0;color:var(--muted);font-size:10px}.bar i{height:7px;border-radius:5px;background:var(--teal);display:block}.empty{text-align:center;padding:28px;color:var(--muted);font-size:11px}.overlap{border:1px solid #f0dba9;background:#fffaf0;border-radius:8px;padding:11px;margin-bottom:8px;color:#755a21}.overlap strong{display:block;font-size:10px}.overlap p{font-size:10px;margin:4px 0;color:#896b31}.timeline{border-left:2px solid #c8e6e0;padding-left:14px;margin:15px 0}.timeline>div{position:relative;margin:0 0 14px}.timeline>div:before{content:"";position:absolute;left:-20px;top:3px;width:8px;height:8px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 3px #def6f1}.timeline strong{font-size:11px}.timeline p{color:var(--muted);font-size:10px;line-height:1.5;margin:4px 0}.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kv div{background:#f7fafc;border:1px solid #e7eef2;border-radius:8px;padding:10px}.kv span{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800}.kv strong{display:block;font-size:11px;margin-top:5px}.public-page{max-width:1180px;margin:auto}.public-hero{background:linear-gradient(120deg,#e9faf6,#f8ffff);border:1px solid #bfe5dd;border-radius:15px;padding:32px;margin:10px 0 18px}.public-hero h2{font-size:37px;max-width:720px;line-height:1.05;letter-spacing:-1.4px;margin:9px 0}.public-hero p{max-width:700px;color:#60798c;line-height:1.65}.public-layout{display:grid;grid-template-columns:1.25fr .75fr;gap:17px}.ack{padding:12px;border:1px solid #b8e4da;background:#effaf7;border-radius:8px;color:#176960;font-size:11px;line-height:1.7}.ack b{font-family:monospace;color:#07635f}.hidden{display:none!important}.footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:10px;display:flex;justify-content:space-between;gap:12px}
@media(max-width:1050px){.shell{grid-template-columns:205px 1fr}.content{padding:20px}.grid4{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr 1fr}.kv{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.shell{display:block}.side{height:auto;position:relative;padding:12px}.side .nav-label,.side-bottom{display:none}.brand{padding-bottom:9px}.nav{display:flex;gap:3px;overflow:auto}.nav button{white-space:nowrap;width:auto}.top{padding:12px 16px}.top h1{font-size:14px}.content{padding:17px}.page-head{display:block}.actions{margin-top:12px}.cols,.public-layout{grid-template-columns:1fr}.three{grid-template-columns:1fr}.public-hero h2{font-size:30px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.footer{display:block;line-height:1.7}}@media(max-width:480px){.grid4{grid-template-columns:1fr 1fr}.grid4 .metric:last-child{grid-column:1/-1}.kv{grid-template-columns:1fr}.brand small{display:none}.user-pill span{display:none}}
</style></head><body><div id="root"></div>
<script>
const seedApps=[{id:'app-clean',ref:'EOA-2026-0001',institution:'Northstar Institute of Technology',instId:'INST-1001',category:'Extension of Approval',programme:'B.Tech Computer Science',intake:120,status:'Validation Completed',docs:4,findings:0,reviewer:'Ananya Rao',updated:'29 Oct 2026'},{id:'app-missing',ref:'EOA-2026-0002',institution:'Riverbend College of Management',instId:'INST-1002',category:'Extension of Approval',programme:'BBA Business Analytics',intake:60,status:'Rectification Required',docs:1,findings:2,reviewer:'Meera Iyer',updated:'28 Oct 2026'},{id:'app-expired',ref:'EOA-2026-0003',institution:'Cedar Valley School of Architecture',instId:'INST-1003',category:'Extension of Approval',programme:'B.Architecture',intake:40,status:'Manual Review Required',docs:4,findings:1,reviewer:'Ananya Rao',updated:'27 Oct 2026'},{id:'app-mismatch',ref:'EOA-2026-0004',institution:'Harborview Technical University',instId:'INST-1004',category:'Change in Intake',programme:'B.Tech Electronics',intake:120,status:'Manual Review Required',docs:3,findings:2,reviewer:'Ananya Rao',updated:'26 Oct 2026'},{id:'app-duplicate',ref:'EOA-2026-0005',institution:'Juniper School of Business',instId:'INST-1005',category:'New Programme',programme:'MBA Digital Strategy',intake:50,status:'Submitted',docs:2,findings:1,reviewer:'Meera Iyer',updated:'25 Oct 2026'}];
const seedCases=[{ref:'AICTE-PGRC-2026-001',institution:'Northstar Institute of Technology',instId:'INST-1001',region:'North',category:'Student grievance',bureau:'PGRC',officer:'Officer Priya Nair',status:'Pending',last:'Response requested',next:'Review institution response',date:'02 Nov 2026',overlap:true,related:'AICTE-RB-2026-014',actions:[['Complaint received','Acknowledgement generated and institution identified.'],['Response requested','Institution response requested within prescribed timeline.']]},{ref:'AICTE-RB-2026-014',institution:'Northstar Institute of Technology',instId:'INST-1001',region:'North',category:'Institutional compliance concern',bureau:'Regulation Bureau',officer:'Officer Kavita Shah',status:'Under Process',last:'Records requested',next:'Coordinate with PGRC',date:'08 Nov 2026',overlap:true,related:'AICTE-PGRC-2026-001',actions:[['Case opened','RB intake identified a matching active PGRC case.'],['Records requested','Institutional records requested; coordination flagged.']]},{ref:'AICTE-PGRC-2026-009',institution:'Riverbend College of Management',instId:'INST-1002',region:'South',category:'Faculty grievance',bureau:'PGRC',officer:'Officer Arjun Rao',status:'Disposed',last:'Closure communication sent',next:'No further action unless new evidence',date:'20 Sep 2026',overlap:false,actions:[['Disposed','Response reviewed and closure communication sent.']]},{ref:'AICTE-RO-2026-031',institution:'Cedar Valley School of Architecture',instId:'INST-1003',region:'West',category:'Student grievance',bureau:'Regional Office — West',officer:'Officer Meenal Joshi',status:'Transferred',last:'Transferred to RB',next:'Receiving Bureau to assign officer',date:'05 Nov 2026',overlap:false,actions:[['Transferred','Matter requires regulatory review and was transferred to RB.']]},{ref:'AICTE-PGRC-2026-004',institution:'Harborview Technical University',instId:'INST-1004',region:'East',category:'Safety and infrastructure',bureau:'PGRC',officer:'Officer Dev Malhotra',status:'Escalated',last:'Escalated to senior review',next:'Competent authority coordination decision',date:'15 Oct 2026',overlap:false,actions:[['Escalated','Expected disposal timeline passed; senior review alert raised.']]}];
let apps=JSON.parse(localStorage.getItem('sv_apps')||'null')||seedApps;let cases=JSON.parse(localStorage.getItem('sv_cases')||'null')||seedCases;let audit=JSON.parse(localStorage.getItem('sv_audit')||'null')||[{time:'29 Oct 2026 10:42',actor:'Ananya Rao',action:'Validation completed',entity:'EOA-2026-0001'},{time:'29 Oct 2026 10:12',actor:'Meera Iyer',action:'Document processed',entity:'doc-d1'},{time:'28 Oct 2026 16:18',actor:'Vikram Sen',action:'Created validation rule',entity:'rule-eoa-2026'}];let ruleData=JSON.parse(localStorage.getItem('sv_rules')||'null')||[{category:'Extension of Approval',version:'2026.1',status:'Active',source:'Demo EoA Handbook §4.2'},{category:'Change in Intake',version:'2026.1',status:'Active',source:'Demo Intake Circular §3.1'},{category:'New Programme',version:'2026.1',status:'Active',source:'Demo Programme Circular §2.4'}];let role=localStorage.getItem('sv_role')||'Government Officer';let view=localStorage.getItem('sv_view')||'dashboard';let selected=apps[0].id;
const $=id=>document.getElementById(id);const save=()=>{localStorage.setItem('sv_apps',JSON.stringify(apps));localStorage.setItem('sv_cases',JSON.stringify(cases));localStorage.setItem('sv_audit',JSON.stringify(audit));localStorage.setItem('sv_rules',JSON.stringify(ruleData));};const now=()=>new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});const chip=s=>{let c=/Disposed|Completed|Verified|Resolved|Active/.test(s)?'green':/Expired|Required|Escalated|High/.test(s)?'red':/Pending|Process|Review|Transferred|Submitted/.test(s)?'amber':'blue';return `<span class="chip ${c}">${s}</span>`};function log(action,entity){audit.unshift({time:now(),actor:role,action,entity});save()}
function menu(){if(role==='Public User')return [['public','Public grievance portal']];if(role==='Institution User')return [['dashboard','My dashboard'],['applications','My applications'],['documents','Document workspace'],['findings','My findings'],['public','Public grievance portal']];return [['dashboard','Government dashboard'],['complaints','Complaint monitoring'],['applications','Applications'],['documents','Documents'],['findings','Findings & review'],['verification','Issuer verification'],['infrastructure','Infrastructure'],['rules','Regulatory rules'],['review','Officer review'],['audit','Audit trail'],['reports','Reports & exports'],['users','Users & roles'],['settings','Settings'],['public','Public portal preview']];}
function render(){let gov=role!=='Institution User'&&role!=='Public User';let title=role==='Institution User'?'Institution workspace':role==='Public User'?'Public Grievance Portal':'AICTE SmartVerify · Government review';let current=menu().find(x=>x[0]===view)?.[1]||title;document.querySelector('#root').innerHTML=`<div class="shell"><aside class="side ${role==='Institution User'?'institution':''}"><div class="brand"><span class="mark"></span><span>SmartVerify<small>${role==='Government Officer'?'Government Officer Portal':role}</small></span></div><nav class="nav"><div class="nav-label">Workspace</div>${menu().map(x=>`<button class="${view===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</nav><div class="side-bottom">SIMULATION MODE / LOCAL ONLY<br><button class="btn" style="margin-top:8px" onclick="switchRole()">Switch workspace</button></div></aside><main class="main"><header class="top"><div><span class="eyebrow">${current}</span><h1>${title}</h1></div><div class="user-pill"><span>${role}</span><span class="avatar">${role==='Government Officer'?'AO':role==='Institution User'?'RK':'PU'}</span></div></header><div class="content"><div class="demo">DEMO ENVIRONMENT — SYNTHETIC DATA — NOT AN OFFICIAL AICTE SYSTEM.</div>${page()}</div></main></div>`}
function go(v){view=v;localStorage.setItem('sv_view',v);render()}function switchRole(){role=role==='Government Officer'?'Institution User':role==='Institution User'?'Public User':'Government Officer';view=role==='Public User'?'public':'dashboard';localStorage.setItem('sv_role',role);localStorage.setItem('sv_view',view);render()}
function statusClass(s){return s}function stat(label,val,sub,cls=''){return `<div class="metric ${cls}"><strong>${val}</strong><span>${label}<br>${sub}</span></div>`}function head(title,desc,actions=''){return `<div class="page-head"><div><h2>${title}</h2><p>${desc}</p></div><div class="actions">${actions}</div></div>`}
function dashboard(){if(role==='Institution User')return institution();let total=apps.length,manual=apps.filter(a=>a.status.includes('Review')).length,missing=apps.filter(a=>a.findings>0).length;return head('Government Officer Command Center','Primary authority view for applications, evidence validation, complaint coordination, and accountable workflow decisions.',`<button class="btn primary" onclick="go('new')">+ New application</button><button class="btn" onclick="go('reports')">Reports →</button>`)+`<div class="alert success"><b>Government officer workspace</b> Automated checks surface evidence for human review. They never grant, reject, or certify an application.</div><div class="grid4">${stat('Total applications',total,'Across demo workflow','blue')}${stat('Pending validation',apps.filter(a=>a.status==='Submitted').length,'Submitted or processing','')}${stat('Manual review',manual,'Needs officer attention','amber')}${stat('Missing / inconsistent',missing,'Open review signals','red')}</div><div class="cols"><div class="card"><div class="card-head"><div><h3>Application review queue</h3><p>Searchable government application register.</p></div></div><div class="card-body"><div class="toolbar"><input class="input search" placeholder="Search reference, institution or programme" oninput="filterApps(this.value)"></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Institution</th><th>Category</th><th>Status</th><th>Findings</th></tr></thead><tbody id="appRows">${appRows(apps)}</tbody></table></div></div></div><div><div class="card"><div class="card-head"><div><h3>Complaint coordination</h3><p>Active alerts from RB and PGRC monitoring.</p></div></div><div class="card-body">${cases.filter(c=>c.overlap).map(c=>`<div class="overlap"><strong>Potential Overlapping Cases — Coordination Required</strong><p>${c.institution}</p><small>${c.ref} · related ${c.related}</small></div>`).join('')}</div></div><div class="card"><div class="card-head"><div><h3>Workflow distribution</h3><p>Current application status.</p></div></div><div class="card-body"><div class="bar"><span>Manual review</span><i style="width:65%"></i><b>${manual}</b></div><div class="bar"><span>Rectification</span><i style="width:45%"></i><b>${apps.filter(a=>a.status.includes('Rectification')).length}</b></div><div class="bar"><span>Completed</span><i style="width:30%"></i><b>${apps.filter(a=>a.status==='Validation Completed').length}</b></div></div></div></div></div>`}
function appRows(list){return list.map(a=>`<tr class="clickable" onclick="openApp('${a.id}')"><td><span class="ref">${a.ref}</span><div class="muted">${a.updated}</div></td><td><b>${a.institution}</b><div class="muted">${a.instId}</div></td><td>${a.category}<div class="muted">${a.programme}</div></td><td>${chip(a.status)}</td><td>${a.findings?`<span class="chip red">${a.findings} open</span>`:'None'}</td></tr>`).join('')}
function filterApps(q){let l=apps.filter(a=>(a.ref+a.institution+a.programme+a.category).toLowerCase().includes(q.toLowerCase()));$('appRows').innerHTML=appRows(l)}
function institution(){let mine=apps.filter(a=>a.instId==='INST-1002');return head('Institution Submission Portal','Prepare evidence, respond to review requests, and track your institution’s authorized applications.','<button class="btn teal" onclick="go(\'new\')">+ New application</button>')+`<div class="alert success"><b>Institution user view</b> You can see and edit only your institution records. Officer validation, issuer verification, and official decisions remain restricted to government users.</div><div class="grid4">${stat('My applications',mine.length,'Authorized records','blue')}${stat('Documents submitted',mine.reduce((n,a)=>n+a.docs,0),'Evidence files','')}${stat('Needs action',mine.filter(a=>a.status==='Rectification Required').length,'Draft or rectification','amber')}${stat('Open findings',mine.reduce((n,a)=>n+a.findings,0),'Reviewer signals','red')}</div><div class="card"><div class="card-head"><div><h3>My application tracker</h3><p>Status and next action for Riverbend College of Management.</p></div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Programme</th><th>Status</th><th>Evidence</th><th>Action</th></tr></thead><tbody>${mine.map(a=>`<tr><td><span class="ref">${a.ref}</span></td><td>${a.programme}<div class="muted">Intake ${a.intake}</div></td><td>${chip(a.status)}</td><td>${a.docs} files</td><td><button class="btn" onclick="openApp('${a.id}')">Open →</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function applications(){return head(role==='Institution User'?'My Applications':'Applications','Search, filter, create, and inspect application records.',`<button class="btn primary" onclick="go('new')">+ New application</button>`)+`<div class="card"><div class="card-body"><div class="toolbar"><input class="input search" placeholder="Search applications…" oninput="filterAppsPage(this.value)"><select class="select" style="max-width:180px" onchange="filterStatus(this.value)"><option>All statuses</option><option>Submitted</option><option>Rectification Required</option><option>Manual Review Required</option><option>Validation Completed</option></select></div><div class="table-wrap"><table><thead><tr><th>Reference</th><th>Institution</th><th>Category</th><th>Status</th><th>Documents</th><th>Findings</th></tr></thead><tbody id="allApps">${appRows(role==='Institution User'?apps.filter(a=>a.instId==='INST-1002'):apps)}</tbody></table></div></div></div>`}
function filterAppsPage(q){let l=(role==='Institution User'?apps.filter(a=>a.instId==='INST-1002'):apps).filter(a=>(a.ref+a.institution+a.programme+a.category).toLowerCase().includes(q.toLowerCase()));$('allApps').innerHTML=appRows(l)}function filterStatus(s){let l=(role==='Institution User'?apps.filter(a=>a.instId==='INST-1002'):apps).filter(a=>s==='All statuses'||a.status===s);$('allApps').innerHTML=appRows(l)}
function newApp(){return head('New Application','Create a synthetic application record. Institution users are automatically assigned to their own institution.')+`<div class="card"><div class="card-body"><form class="formgrid" onsubmit="createApp(event)"><div class="field"><label>Institution name<input required id="fInst" value="${role==='Institution User'?'Riverbend College of Management':''}"></label></div><div class="field"><label>AICTE Permanent ID<input required id="fId" value="${role==='Institution User'?'INST-1002':''}"></label></div><div class="field"><label>Category<select id="fCat"><option>Extension of Approval</option><option>Change in Intake</option><option>New Programme</option><option>Institutional Change</option></select></label></div><div class="field"><label>Academic session<input required id="fSession" value="2026-27"></label></div><div class="field"><label>Programme<input required id="fProgramme" placeholder="B.Tech Computer Science"></label></div><div class="field"><label>Requested intake<input required type="number" id="fIntake" value="60"></label></div><div class="field full"><label>Faculty / department<input id="fFaculty" placeholder="Engineering / Management"></label></div><div class="field full"><label>Previous approval reference<input id="fPrevious" placeholder="Optional previous approval reference"></label></div><div class="field full"><button class="btn primary" type="submit">Save draft application</button></div></form></div></div>`}
function createApp(e){e.preventDefault();let a={id:'app-'+Date.now(),ref:'EOA-2026-'+String(Date.now()).slice(-5),institution:$('fInst').value,instId:$('fId').value,category:$('fCat').value,programme:$('fProgramme').value,intake:Number($('fIntake').value),status:'Draft',docs:0,findings:0,reviewer:role==='Government Officer'?'Ananya Rao':null,updated:'Just now'};apps.unshift(a);log('Created application',a.ref);save();selected=a.id;go('detail')}
function openApp(id){selected=id;go('detail')}function appDetail(){let a=apps.find(x=>x.id===selected)||apps[0];if(!a)return '<div class="empty">Application not found.</div>';return head(a.ref,`${a.institution} · ${a.category}`,`<button class="btn" onclick="go('applications')">← Back</button><button class="btn primary" onclick="runValidation()">Run validation</button>`)+`<div class="alert ${a.status==='Validation Completed'?'success':''}"><b>${a.status}</b> Automated indicators are advisory; an authorized officer owns the statutory decision.</div><div class="kv"><div><span>Institution</span><strong>${a.institution}</strong></div><div><span>AICTE Permanent ID</span><strong>${a.instId}</strong></div><div><span>Programme / intake</span><strong>${a.programme} / ${a.intake}</strong></div><div><span>Reviewer</span><strong>${a.reviewer||'Awaiting assignment'}</strong></div></div><div class="cols" style="margin-top:17px"><div><div class="card"><div class="card-head"><div><h3>Documents and evidence</h3><p>Originals are simulated in this browser-only file.</p></div><label class="btn teal">Upload document<input type="file" hidden onchange="uploadLocal(event)"></label></div><div class="card-body">${a.docs?`<div class="notice success">${a.docs} document(s) indexed. SHA-256 and extraction are simulated in standalone mode.</div>`:'<div class="empty">No documents uploaded. Add a file to simulate document indexing.</div>'}<div class="timeline"><div><strong>Document workspace ready</strong><p>Supported demo formats: PDF, PNG, JPG, JPEG, and text fixtures.</p></div></div></div></div><div class="card"><div class="card-head"><div><h3>Findings</h3><p>Explainable signals requiring human review.</p></div></div><div class="card-body">${a.findings?`<div class="alert"><b>Potential review items detected</b>${a.findings} open item(s) are linked to this application. See Findings & review for resolution.</div>`:'<div class="notice success">No open findings for this demo record.</div>'}</div></div></div><div><div class="card"><div class="card-head"><div><h3>Simulated issuer verification</h3><p>Never an official source response.</p></div></div><div class="card-body"><select class="select" id="scenario"><option>verified</option><option>mismatch</option><option>expired</option><option>pending</option><option>unavailable</option><option>manual_review</option></select><button class="btn primary" style="margin-top:10px" onclick="simulateVerify()">Run simulated check</button><div id="verifyOut"></div></div></div><div class="card"><div class="card-head"><div><h3>Workflow</h3><p>Current status: ${a.status}</p></div></div><div class="card-body"><select class="select" id="newStatus"><option>${a.status}</option><option>Draft</option><option>Submitted</option><option>Processing</option><option>Rectification Required</option><option>Manual Review Required</option><option>Officer Review</option><option>Decision Pending</option><option>Validation Completed</option></select><button class="btn teal" style="margin-top:10px" onclick="updateStatus()">Save workflow status</button></div></div></div></div>`}
function uploadLocal(e){let f=e.target.files[0];if(!f)return;let a=apps.find(x=>x.id===selected);a.docs++;a.updated='Just now';log('Uploaded and processed document',a.ref);save();render()}
function runValidation(){let a=apps.find(x=>x.id===selected);a.status=a.docs<4?'Rectification Required':'Validation Completed';a.findings=a.docs<4?Math.max(1,4-a.docs):0;log('Ran validation engine',a.ref);save();render()}
function simulateVerify(){let a=apps.find(x=>x.id===selected),s=$('scenario').value;let msg=s==='verified'?'Verified — synthetic source matched.':s==='unavailable'?'Source unavailable — manual verification required.':s==='mismatch'?'Mismatch — review discrepancy against source evidence.':s==='expired'?'Expired — obtain current evidence.':s==='pending'?'Verification pending — await source response.':'Manual review — source response requires officer assessment.';$('verifyOut').innerHTML=`<div class="notice" style="margin-top:13px"><b>SIMULATED ONLY</b><br>${msg}<br><small>Source: Synthetic issuer adapter · no official system contacted.</small></div>`;log('Ran simulated issuer verification',a.ref);save()}
function updateStatus(){let a=apps.find(x=>x.id===selected);a.status=$('newStatus').value;a.updated='Just now';log('Updated application workflow',a.ref);save();render()}
function documents(){let a=role==='Institution User'?apps.filter(x=>x.instId==='INST-1002'):apps;return head('Document Workspace','Upload and inspect evidence linked to applications. Text extraction and OCR are simulated in this standalone file.')+`<div class="card"><div class="card-body"><div class="notice">Local standalone mode: uploaded files are counted in browser storage only. The full server version stores originals, hashes, extracted fields, and page evidence.</div><div class="table-wrap"><table><thead><tr><th>Application</th><th>Institution</th><th>Documents</th><th>Processing</th><th>Action</th></tr></thead><tbody>${a.map(x=>`<tr><td class="ref">${x.ref}</td><td>${x.institution}<div class="muted">${x.instId}</div></td><td>${x.docs}</td><td>${chip('Processed')}</td><td><button class="btn" onclick="openApp('${x.id}')">Open workspace</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function findings(){let a=role==='Institution User'?apps.filter(x=>x.instId==='INST-1002'):apps;return head(role==='Institution User'?'My Findings':'Findings & Review','Evidence-linked review signals. Automated indicators never assert fraud or forgery.')+`<div class="card"><div class="card-body">${a.flatMap(x=>Array.from({length:x.findings},(_,i)=>`<div class="alert" style="display:flex;justify-content:space-between;gap:12px"><div><b>${i%2?'Institutional record mismatch':'Missing or incomplete evidence'}</b><br>${x.ref} · ${x.institution}<br><span class="muted">Potential review signal — manual verification required. Next step: inspect source documents and record officer remarks.</span></div><button class="btn" onclick="resolveFinding('${x.id}')">Resolve</button></div>`)).join('')||'<div class="empty">No open findings.</div>'}</div></div>`}
function resolveFinding(id){let a=apps.find(x=>x.id===id);if(a.findings)a.findings--;log('Resolved finding',a.ref);save();render()}
function verification(){return head('Issuer Verification','Run clearly labelled simulated scenarios only. No official government source is contacted.')+`<div class="card"><div class="card-body"><div class="alert"><b>SIMULATED ADAPTER</b> Results are demonstrations with synthetic provenance. Do not treat them as official verification.</div>${apps.map(a=>`<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line);padding:12px 0"><div><b>${a.ref}</b><div class="muted">${a.institution}</div></div><button class="btn" onclick="openApp('${a.id}')">Open verification →</button></div>`).join('')}</div></div>`}
function complaints(){let active=cases.filter(c=>c.status!=='Disposed').length,over=cases.filter(c=>c.overlap).length;return head('Institution Complaint Monitoring','Government-only single source of truth for RB, PGRC, Regional Office, and other Bureau/Cell cases.',`<button class="btn" onclick="go('public')">Preview public portal</button>`)+`<div class="alert"><b>Potential overlapping cases are coordination alerts.</b> They are not findings of misconduct or official decisions.</div><div class="grid4">${stat('Total cases',cases.length,'All monitored complaint cases','blue')}${stat('Pending / active',active,'Across Bureaus and Cells','amber')}${stat('Disposed',cases.filter(c=>c.status==='Disposed').length,'Recorded closure','')}${stat('Overlap alerts',over,'Same institution, active cases','red')}</div><div class="card"><div class="card-head"><div><h3>Centralized case register</h3><p>Click a case to inspect complete movement history.</p></div></div><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Case ID</th><th>Institution</th><th>Category / region</th><th>Bureau / officer</th><th>Status</th><th>Expected disposal</th></tr></thead><tbody>${cases.map(c=>`<tr class="clickable ${c.overlap?'selected':''}" onclick="showCase('${c.ref}')"><td><span class="ref">${c.ref}</span>${c.overlap?'<div class="chip amber">overlap</div>':''}</td><td><b>${c.institution}</b><div class="muted">${c.instId}</div></td><td>${c.category}<div class="muted">${c.region}</div></td><td>${c.bureau}<div class="muted">${c.officer}</div></td><td>${chip(c.status)}</td><td>${c.date}</td></tr>`).join('')}</tbody></table></div></div></div><div id="caseDetail"></div>`}
function showCase(ref){let c=cases.find(x=>x.ref===ref);$('caseDetail').innerHTML=`<div class="card"><div class="card-head"><div><h3>Case movement · ${c.ref}</h3><p>${c.institution} · ${c.bureau} · ${c.officer}</p></div>${chip(c.status)}</div><div class="card-body"><div class="kv"><div><span>Last action</span><strong>${c.last}</strong></div><div><span>Next action</span><strong>${c.next}</strong></div><div><span>Region</span><strong>${c.region}</strong></div><div><span>Related cases</span><strong>${c.related||'None identified'}</strong></div></div><div class="timeline">${c.actions.map(a=>`<div><strong>${a[0]}</strong><p>${a[1]}</p></div>`).join('')}</div></div></div>`}
function rules(){return head('Regulatory Rules','Versioned demo rule configuration. Government administrators can add rule records.')+`<div class="cols"><div class="card"><div class="card-head"><div><h3>Configured rule versions</h3><p>Effective date and source reference remain visible.</p></div></div><div class="card-body"><table><thead><tr><th>Category</th><th>Version</th><th>Source</th><th>Status</th></tr></thead><tbody>${ruleData.map(r=>`<tr><td>${r.category}</td><td>${r.version}</td><td>${r.source}</td><td>${chip(r.status)}</td></tr>`).join('')}</tbody></table></div></div><div class="card"><div class="card-head"><div><h3>Add rule version</h3><p>Saved in local browser storage.</p></div></div><div class="card-body"><form class="formgrid" onsubmit="addRule(event)"><div class="field"><label>Category<input required id="rCat"></label></div><div class="field"><label>Version<input required id="rVer" value="2026.2"></label></div><div class="field full"><label>Source reference<input required id="rSource" placeholder="Demo circular §1.1"></label></div><div class="field full"><button class="btn primary">Save rule</button></div></form></div></div></div>`}
function addRule(e){e.preventDefault();ruleData.push({category:$('rCat').value,version:$('rVer').value,status:'Draft',source:$('rSource').value});log('Created validation rule version',$('rCat').value);save();render()}
function auditPage(){return head('Audit Trail','Searchable local record of actor, role, action, entity, timestamp, and workflow changes.')+`<div class="card"><div class="card-body"><input class="input" placeholder="Search audit events…" oninput="filterAudit(this.value)"><div class="table-wrap" style="margin-top:14px"><table><thead><tr><th>Time</th><th>Actor / role</th><th>Action</th><th>Entity</th></tr></thead><tbody id="auditRows">${auditRows(audit)}</tbody></table></div></div></div>`}function auditRows(l){return l.map(x=>`<tr><td class="muted">${x.time}</td><td><b>${x.actor}</b><div class="muted">${role}</div></td><td>${x.action}</td><td class="ref">${x.entity}</td></tr>`).join('')}function filterAudit(q){$('auditRows').innerHTML=auditRows(audit.filter(x=>(x.actor+x.action+x.entity).toLowerCase().includes(q.toLowerCase())))}
function reports(){return head('Reports & Exports','Generate local JSON, CSV, or printable summaries. Reports are synthetic and non-official.')+`<div class="card"><div class="card-body"><div class="table-wrap"><table><thead><tr><th>Application</th><th>Status</th><th>Documents</th><th>Open findings</th><th>Exports</th></tr></thead><tbody>${apps.map(a=>`<tr><td><b>${a.ref}</b><div class="muted">${a.institution}</div></td><td>${chip(a.status)}</td><td>${a.docs}</td><td>${a.findings}</td><td><button class="btn" onclick="downloadReport('${a.id}','json')">JSON</button> <button class="btn" onclick="downloadReport('${a.id}','csv')">CSV</button> <button class="btn" onclick="printReport('${a.id}')">Print</button></td></tr>`).join('')}</tbody></table></div></div></div>`}
function downloadReport(id,type){let a=apps.find(x=>x.id===id),data={demoNotice:'SYNTHETIC DATA — NOT AN OFFICIAL AICTE RECORD',reference:a.ref,institution:a.institution,status:a.status,documents:a.docs,openFindings:a.findings,generatedAt:now()};let text=type==='csv'?`Reference,Institution,Status,Documents,Open Findings\n"${a.ref}","${a.institution}","${a.status}",${a.docs},${a.findings}`:JSON.stringify(data,null,2);let blob=new Blob([text],{type:type==='csv'?'text/csv':'application/json'}),u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download=a.ref+'.'+type;x.click();URL.revokeObjectURL(u);log('Exported report',a.ref)}function printReport(id){let a=apps.find(x=>x.id===id);let w=window.open('','_blank');w.document.write(`<h1>AICTE SmartVerify — DEMO REPORT</h1><p>SYNTHETIC DATA — NOT AN OFFICIAL AICTE RECORD</p><h2>${a.ref}</h2><p>Institution: ${a.institution}<br>Status: ${a.status}<br>Documents: ${a.docs}<br>Open findings: ${a.findings}</p>`);w.print()}
function users(){return head('Users & Roles','Fictional local accounts used to demonstrate role separation.')+`<div class="card"><div class="card-body"><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Scope</th></tr></thead><tbody><tr><td>Ananya Rao</td><td>ananya.rao@demo.gov</td><td>${chip('AICTE Officer/Reviewer')}</td><td>Government command center and complaint monitoring</td></tr><tr><td>Vikram Sen</td><td>vikram.sen@demo.gov</td><td>${chip('System Administrator')}</td><td>Rules, users, settings</td></tr><tr><td>Rohan Kulkarni</td><td>rohan.kulkarni@fictional.edu</td><td>${chip('Institution Applicant')}</td><td>INST-1002 only</td></tr></tbody></table></div></div>`}function settings(){return head('Settings & Integrations','Demo capabilities and production integration boundaries.')+`<div class="three"><div class="card"><div class="card-body"><h3>Document processing</h3><p class="muted">Text extraction available. OCR and malware scanning require production services.</p>${chip('Demo mode')}</div></div><div class="card"><div class="card-body"><h3>Issuer verification</h3><p class="muted">No official API or portal is configured. All checks are simulated.</p>${chip('SIMULATED ONLY')}</div></div><div class="card"><div class="card-body"><h3>Storage</h3><p class="muted">This standalone file stores data in browser localStorage only.</p>${chip('Local only')}</div></div></div>`}
function publicPage(){return `<div class="public-page"><div class="public-hero"><span class="kicker">For students · faculty · institutions · stakeholders</span><h2>One place to raise a concern and follow its progress.</h2><p>Submit a technical-education grievance and receive a case reference. Track your public-safe status using your reference and email.</p><span class="chip green">PUBLIC ACCESS · NO LOGIN REQUIRED</span></div><div class="public-layout"><div class="card public-card"><div class="card-head"><div><h3>Submit a grievance</h3><p>Do not include passwords, Aadhaar numbers, bank details, or sensitive medical information.</p></div></div><div class="card-body"><form class="formgrid" onsubmit="submitCase(event)"><div class="field"><label>Full name<input required id="pName"></label></div><div class="field"><label>Email for tracking<input required type="email" id="pEmail"></label></div><div class="field full"><label>Institution name<input required id="pInst"></label></div><div class="field"><label>AICTE Permanent ID<input id="pId"></label></div><div class="field"><label>Region<select id="pRegion"><option>North</option><option>South</option><option>East</option><option>West</option><option>Central</option></select></label></div><div class="field full"><label>Category<select id="pCat"><option>Student grievance</option><option>Faculty grievance</option><option>Institutional compliance concern</option><option>Safety and infrastructure</option><option>Other stakeholder concern</option></select></label></div><div class="field full"><label>What happened?<textarea required minlength="20" id="pDesc"></textarea></label></div><div id="pAck" class="field full"></div><div class="field full"><button class="btn teal">Submit complaint</button></div></form></div></div><div><div class="card public-card"><div class="card-head"><div><h3>Track an existing case</h3><p>Use the reference and submission email.</p></div></div><div class="card-body"><form onsubmit="trackCase(event)"><div class="field"><label>Case reference<input required id="tRef" placeholder="AICTE-PUBLIC-2026-…"></label></div><div class="field" style="margin-top:12px"><label>Email<input required type="email" id="tEmail"></label></div><button class="btn teal" style="margin-top:12px">Find case →</button></form><div id="trackOut"></div></div></div><div class="card"><div class="card-body"><b>Privacy and safety</b><p class="muted" style="line-height:1.6">Public tracking reveals only case status and coordination-safe milestones. Internal notes and complainant data remain restricted.</p></div></div></div></div></div>`}
function submitCase(e){e.preventDefault();let ref='AICTE-PUBLIC-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6),email=$('pEmail').value;let c={ref,institution:$('pInst').value,instId:$('pId').value||'Pending identification',region:$('pRegion').value,category:$('pCat').value,bureau:'PGRC Intake',officer:'Awaiting assignment',status:'Received',last:'Complaint submitted through public portal',next:'Initial triage and institution identification',date:'Within 21 days',email,overlap:false,actions:[['Complaint received','Acknowledgement generated. Case is awaiting initial triage.']]};cases.unshift(c);save();$('pAck').innerHTML=`<div class="ack"><b>Complaint received.</b><br>Case reference: <b>${ref}</b><br>Keep the reference and your submission email for tracking.</div>`;log('Public complaint submitted',ref);$('tRef').value=ref;$('tEmail').value=email)}function trackCase(e){e.preventDefault();let c=cases.find(x=>x.ref===$('tRef').value.trim()&&x.email&&x.email.toLowerCase()===$('tEmail').value.trim().toLowerCase());$('trackOut').innerHTML=c?`<div class="result"><h3>${c.ref} ${chip(c.status)}</h3><div class="kv"><div><span>Institution</span><strong>${c.institution}</strong></div><div><span>Current Bureau</span><strong>${c.bureau}</strong></div><div><span>Last action</span><strong>${c.last}</strong></div><div><span>Next action</span><strong>${c.next}</strong></div></div><div class="timeline">${c.actions.map(a=>`<div><strong>${a[0]}</strong><p>${a[1]}</p></div>`).join('')}</div></div>`:'<div class="alert danger" style="margin-top:12px">No case matched that reference and email.</div>'}
function page(){if(view==='dashboard')return dashboard();if(view==='applications')return applications();if(view==='new')return newApp();if(view==='detail')return appDetail();if(view==='documents')return documents();if(view==='findings')return findings();if(view==='verification')return verification();if(view==='complaints')return complaints();if(view==='rules')return rules();if(view==='audit')return auditPage();if(view==='reports')return reports();if(view==='users')return users();if(view==='settings')return settings();if(view==='public')return publicPage();return dashboard()}
render();
</script></body></html>
